name: Master list layer

# The master list of species documented from India (pipeline/master.py), built on the latest published
# snapshot with the iNaturalist species lists, new species, ZSI, WCVP, BSI and IUCN inputs. No GBIF downloads.
# Daily after the iNaturalist and new species layers: it matches new names with GBIF within its time limit
# and does nothing when no input changed. Scheduled runs need the repository variable PIPELINE_ENABLED = true.

on:
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:

concurrency:
  group: master
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  master:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v6
        with:
          path: data/ref
          key: lgd-districts-v1
      - name: Build the layer
        env:
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u -m pipeline.master --publish --minutes 240
      - name: Check the numbers the site shows
        run: python -u scripts/check_numbers.py
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Master list layer failed ($(date -u +%Y-%m-%d))" \
            --body "The master list workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
