name: Build and publish

# Every 6 hours on days 1 to 10: if this month's GBIF downloads are ready, build the snapshot,
# check it, upload it to R2 and commit site/data/latest.json. Otherwise exit quietly.
# Scheduled runs need the repository variable PIPELINE_ENABLED = true and always publish.
# Manual runs publish only when asked; test runs (one state) are never published.

on:
  schedule:
    - cron: "30 */6 1-10 * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id, e.g. 2026-11 or 2026-10-kerala (empty = this month)"
        required: false
        default: ""
      publish:
        description: "Upload to R2 (all-India runs only)"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v6
        with:
          path: data/ref
          key: lgd-districts-v1
      - name: Build
        env:
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_ID: ${{ inputs.run_id }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          args=()
          [ -n "$RUN_ID" ] && args+=(--run-id "$RUN_ID")
          [ "$PUBLISH" = "true" ] && args+=(--publish)
          python -m pipeline.run build "${args[@]}"
      - name: Keep the built snapshot (unpublished runs)
        if: always() && hashFiles('data/snapshots/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: data/snapshots
          retention-days: 14
      - name: Commit run state and latest.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in runs site/data; do [ -e "$p" ] && git add "$p"; done
          git diff --cached --quiet || { git commit -m "Update run state"; git push; }
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Monthly build failed ($(date -u +%Y-%m-%d))" \
            --body "The build workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
