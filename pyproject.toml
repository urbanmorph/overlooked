[project]
name = "overlooked"
version = "0.1.0"
description = "Monthly monitor of gaps in India's public biodiversity data"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "duckdb>=1.1,<2",  # 2.0 drops fetchone() on relations; move to it as its own change
  "pyarrow>=17",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "boto3>=1.35",
  "pymupdf>=1.24",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
# experiments/ needs the ML environment (data/model_check/.venv); run its tests there.
testpaths = ["tests"]
